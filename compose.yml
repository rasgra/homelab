name: stormyra-stack

networks:
  frontend:
    driver: bridge
    external: false
    internal: false
    name: frontend
  uisp-backend:
    driver: bridge
    external: false
    internal: true
    name: uisp-backend
  jitsi-backend:
    driver: bridge
    external: false
    internal: false
    name: jitsi-backend
  nextcloud-backend:
    driver: bridge
    external: false
    internal: true
    name: nextcloud-backend
  training-backend:
    driver: bridge
    external: false
    # internal: false so training-api can reach Garmin's auth endpoints
    # for the Garmin Connect sync. Containers still are not reachable
    # from outside the host — no ports mapped.
    internal: false
    name: training-backend

include:
  - ./caddy/compose.yml
  - ./caddy/cloudflared/compose.yml
  - ./nextcloud/compose.yml
  - ./uisp/compose.yml
  - ./jitsi-deploy/compose.yml
  - ./unifi/compose.yml
  - ./finance/compose.yml
  - ./training/compose.yml
  - ./homeassistant/compose.yml


