services:
  caddy:
    image: caddy:2
    container_name: caddy
    restart: unless-stopped
    env_file:
      - ../.env
    networks:
      - frontend
    # host.docker.internal lets Caddy reach services that run with
    # network_mode: host (e.g. homeassistant on :8123). Pinned to the
    # frontend bridge gateway because host-gateway resolves to docker0
    # (172.17.0.1) which is unreachable from this user-defined bridge.
    extra_hosts:
      - "host.docker.internal:172.22.0.1"
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"   # for HTTP/3 (optional)
    healthcheck:
      test: ["CMD", "curl", "-fso", "/dev/null", "http://localhost:2019/config"]
      interval: 30s
      timeout: 5s
      retries: 3
    volumes:
      - ${DATA_DIR}/caddy/Caddyfile:/etc/caddy/Caddyfile:ro
      - ${DATA_DIR}/caddy/data:/data
      - ${DATA_DIR}/caddy/config:/config
      - ${DATA_DIR}/caddy/files:/srv/files:ro
