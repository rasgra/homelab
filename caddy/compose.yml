services:
  caddy:
    image: caddy:2
    container_name: caddy
    restart: unless-stopped
    env_file:
      - ../.env
    networks:
      - frontend
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"   # for HTTP/3 (optional)
    healthcheck:
      test: ["CMD", "curl", "-fso", "/dev/null", "http://localhost:2019/config"]
      interval: 30s
      timeout: 5s
      retries: 3
    volumes:
      - ${DATA_DIR}/caddy/Caddyfile:/etc/caddy/Caddyfile:ro
      - ${DATA_DIR}/caddy/data:/data
      - ${DATA_DIR}/caddy/config:/config
      - ${DATA_DIR}/caddy/files:/srv/files:ro
