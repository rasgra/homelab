services:
  web:
    profiles: ["jitsi"]
    image: jitsi/web:stable-10655
    restart: unless-stopped
    networks:
      - frontend
      - jitsi-backend
    env_file:
      - ../.env
      - ./.env
      - ./.env.secrets
    environment:
      - PUBLIC_URL=https://meet.${BASE_DOMAIN}
      - DYNAMIC_BRANDING_URL=https://meet.${BASE_DOMAIN}/static/branding.json
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:80"]
      interval: 30s
      timeout: 5s
      retries: 3
    volumes:
      - ${DATA_DIR}/jitsi/web:/config
      - ./nginx-custom:/config/nginx-custom:ro
      - ./branding/stormyra-consulting-ab-white.svg:/usr/share/jitsi-meet/images/watermark.svg:ro
      - ./branding/stormyra-consulting-ab-white.svg:/usr/share/jitsi-meet/images/logo.svg:ro
      - ./branding/bg.png:/usr/share/jitsi-meet/images/welcome-background.png:ro
      - ./branding/branding.json:/usr/share/jitsi-meet/static/branding.json:ro
      - ./branding/custom.css:/usr/share/jitsi-meet/custom.css:ro
      - ./branding/custom.js:/usr/share/jitsi-meet/custom.js:ro
    depends_on:
      - prosody
      - jicofo
      - jvb

  prosody:
    profiles: ["jitsi"]
    image: jitsi/prosody:stable-10655
    restart: unless-stopped
    networks:
      - jitsi-backend
    env_file:
      - ../.env
      - ./.env
      - ./.env.secrets
    healthcheck:
      test: ["CMD-SHELL", "prosodyctl status | grep -q 'running'"]
      interval: 30s
      timeout: 5s
      retries: 3
    volumes:
      - ${DATA_DIR}/jitsi/prosody:/config

  jicofo:
    profiles: ["jitsi"]
    image: jitsi/jicofo:stable-10655
    restart: unless-stopped
    networks:
      - jitsi-backend
    env_file:
      - ../.env
      - ./.env
      - ./.env.secrets
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8888/about/health"]
      interval: 30s
      timeout: 5s
      retries: 3
    volumes:
      - ${DATA_DIR}/jitsi/jicofo:/config
    depends_on:
      - prosody

  jvb:
    profiles: ["jitsi"]
    image: jitsi/jvb:stable-10655
    restart: unless-stopped
    networks:
      - jitsi-backend
    ports:
      - "10000:10000/udp"
    env_file:
      - ../.env
      - ./.env
      - ./.env.secrets
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8080/about/health"]
      interval: 30s
      timeout: 5s
      retries: 3
    volumes:
      - ${DATA_DIR}/jitsi/jvb:/config
    depends_on:
      - prosody

